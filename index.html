<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Khám Phá Trải Nghiệm Mới</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink-dark: #c9184a;
            /* Thủy tinh lỏng trong suốt và mượt hơn */
            --glass-card: rgba(255, 255, 255, 0.28);
            --glass-border: rgba(255, 255, 255, 0.6);
            --glass-shadow: 0 20px 50px rgba(201, 24, 74, 0.18);
            --ios-font: 'Plus Jakarta Sans', -apple-system, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: var(--ios-font);
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffb3c1;
        }

        /* Nền động màu hồng chuyển động mượt mà */
        .animated-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(-45deg, #ff9a9e, #fecfef, #ff758f, #ffb3c6);
            background-size: 400% 400%;
            animation: gradientMove 12s ease infinite;
            z-index: 1;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Blobs thủy tinh lỏng mềm mại */
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.85;
            z-index: 2;
            animation: floatBlob 10s ease-in-out infinite alternate;
        }

        .blob-1 { width: 320px; height: 320px; background: #ff4d6d; top: 10%; left: 10%; }
        .blob-2 { width: 350px; height: 350px; background: #ff85a1; bottom: 10%; right: 10%; animation-delay: -5s; }

        @keyframes floatBlob {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 40px) scale(1.2); }
        }

        #particleCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
        }

        /* Khung kính iOS Liquid Glassmorphic */
        .glass-card {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 420px;
            padding: 36px 28px;
            background: var(--glass-card);
            backdrop-filter: blur(35px) saturate(200%);
            -webkit-backdrop-filter: blur(35px) saturate(200%);
            border-radius: 36px;
            border: 1.5px solid var(--glass-border);
            box-shadow: var(--glass-shadow), inset 0 2px 5px rgba(255, 255, 255, 0.9);
            text-align: center;
            animation: iosPopIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes iosPopIn {
            0% { opacity: 0; transform: scale(0.85) translateY(30px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .icon-wrapper {
            width: 72px;
            height: 72px;
            margin: 0 auto 20px auto;
            background: linear-gradient(135deg, #ff758f, #ff4d6d);
            border-radius: 22px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            box-shadow: 0 12px 24px rgba(255, 77, 109, 0.4);
            animation: pulseIcon 2s ease-in-out infinite;
        }

        .gift-box-icon {
            font-size: 80px;
            margin-bottom: 20px;
            cursor: pointer;
            animation: giftBounce 1.2s ease-in-out infinite alternate;
        }

        @keyframes giftBounce {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-15px) scale(1.1); }
        }

        .instruction-box {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 18px 16px;
            margin-bottom: 28px;
            border: 1px solid rgba(255, 255, 255, 0.7);
        }

        .instruction-title {
            color: var(--pink-dark);
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 6px;
        }

        .instruction-text {
            color: #590d22;
            font-size: 17px;
            font-weight: 600;
        }

        .button-group {
            display: flex;
            gap: 14px;
            justify-content: center;
        }

        .ios-btn {
            flex: 1;
            padding: 16px 20px;
            font-size: 16px;
            font-weight: 700;
            font-family: var(--ios-font);
            border-radius: 20px;
            border: none;
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease;
        }

        .btn-continue {
            background: linear-gradient(135deg, #ff4d6d 0%, #c9184a 100%);
            color: #ffffff;
            box-shadow: 0 10px 20px rgba(201, 24, 74, 0.35);
        }

        .btn-exit {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            color: var(--pink-dark);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .ios-btn:active {
            transform: scale(0.95);
        }

        /* Màn hình Troll */
        #trollScreen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 999;
            overflow: hidden;
        }

        /* GIF 1 Nháy Đủ Màu */
        .color-flash {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            animation: rainbowFlash 0.08s linear infinite;
        }

        @keyframes rainbowFlash {
            0% { filter: hue-rotate(0deg) invert(0); opacity: 1; }
            25% { filter: hue-rotate(90deg) invert(0.8); opacity: 0.3; }
            50% { filter: hue-rotate(180deg) invert(0); opacity: 1; }
            75% { filter: hue-rotate(270deg) invert(0.8); opacity: 0.3; }
            100% { filter: hue-rotate(360deg) invert(0); opacity: 1; }
        }

        /* Ảnh Chó Phóng To Thu Nhỏ Vĩnh Viễn */
        .dog-img {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 80%;
            max-height: 80%;
            z-index: 1000;
            animation: dogPulse 0.15s ease-in-out infinite alternate;
        }

        @keyframes dogPulse {
            0% { transform: translate(-50%, -50%) scale(0.2); }
            100% { transform: translate(-50%, -50%) scale(2.2); }
        }

        /* Hiệu ứng nổ giật mình ban đầu */
        .jumpscare-shock {
            animation: shockZoom 0.2s cubic-bezier(0.1, 0.9, 0.2, 1) forwards, dogPulse 0.15s ease-in-out infinite alternate 0.2s;
        }

        @keyframes shockZoom {
            0% { transform: translate(-50%, -50%) scale(0.01); }
            50% { transform: translate(-50%, -50%) scale(4); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }
    </style>
</head>
<body>

    <div class="animated-bg"></div>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <canvas id="particleCanvas"></canvas>

    <!-- Màn 1: Xác nhận -->
    <div id="step1" class="glass-card">
        <div class="icon-wrapper">✨</div>
        <div class="instruction-box">
            <div class="instruction-title">Xác Nhận</div>
            <div class="instruction-text">Bạn có muốn tiếp tục khám phá điều bất ngờ không?</div>
        </div>
        <div class="button-group">
            <button class="ios-btn btn-exit" onclick="goToGiftStep()">Thoát</button>
            <button class="ios-btn btn-continue" onclick="goToGiftStep()">Tiếp tục</button>
        </div>
    </div>

    <!-- Màn 2: Trang Hộp Quà Thủy Tinh Lỏng -->
    <div id="step2" class="glass-card" style="display: none;">
        <div class="gift-box-icon" onclick="startTroll()">🎁</div>
        <div class="instruction-box">
            <div class="instruction-title">Phần Quà Bí Mật</div>
            <div class="instruction-text">Chạm vào hộp quà để mở điều bất ngờ!</div>
        </div>
        <button class="ios-btn btn-continue" style="width: 100%;" onclick="startTroll()">Mở Hộp Quà</button>
    </div>

    <!-- Màn 3: Troll Vĩnh Viễn -->
    <div id="trollScreen">
        <img class="color-flash" src="http://genk.mediacdn.vn/2017/baby-giphy-3-1496376925165.gif" alt="GIF 1">
        <img class="dog-img jumpscare-shock" src="https://makeagif.com/i/tVlnwj" alt="Dog">
        
        <!-- LINK NHẠC ARCHIVE.ORG CỦA BẠN (Thay đường link bên dưới bằng link trực tiếp từ Archive.org) -->
        <audio id="audioTrack" src="https://soundbible.com/grab.php?id=1548&type=mp3" preload="auto" loop></audio>
    </div>

    <script>
        // Chuyển sang màn Hộp quà
        function goToGiftStep() {
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'block';
        }

        // Bắt đầu Troll
        function startTroll() {
            const trollScreen = document.getElementById('trollScreen');
            const audio = document.getElementById('audioTrack');

            trollScreen.style.display = 'block';

            // Phát âm thanh max volume
            audio.volume = 1.0;
            audio.currentTime = 0;
            audio.play().catch(e => console.log(e));

            // Bật toàn màn hình
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            } else if (document.documentElement.webkitRequestFullscreen) {
                document.documentElement.webkitRequestFullscreen();
            }
        }

        // Tạo hiệu ứng hạt bong bóng thủy tinh
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const particles = [];
        for (let i = 0; i < 25; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 6 + 2,
                alpha: Math.random() * 0.5 + 0.2,
                speedY: Math.random() * 0.8 + 0.3,
                speedX: Math.sin(Math.random() * Math.PI) * 0.4
            });
        }

        function drawParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
                ctx.fill();
                p.y -= p.speedY;
                p.x += p.speedX;
                if (p.y < -10) { p.y = canvas.height + 10; p.x = Math.random() * canvas.width; }
            });
            requestAnimationFrame(drawParticles);
        }
        drawParticles();
    </script>
</body>
</html>
