<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Khám Phá Trải Nghiệm Mới</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink-light: #ffd1dc;
            --pink-medium: #ff758f;
            --pink-deep: #ff4d6d;
            --pink-dark: #c9184a;
            --glass-bg: rgba(255, 182, 193, 0.35);
            --glass-card: rgba(255, 255, 255, 0.45);
            --glass-border: rgba(255, 255, 255, 0.65);
            --glass-shadow: 0 30px 60px rgba(201, 24, 74, 0.25);
            --ios-font: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: var(--ios-font);
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffb3c1;
        }

        /* Nền động chuyển màu Gradient iOS */
        .animated-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(-45deg, #ff9a9e, #fecfef, #ff758f, #ffb3c6);
            background-size: 400% 400%;
            animation: gradientMove 12s ease infinite;
            z-index: 1;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Đốm sáng thủy tinh di chuyển phía sau (Blobs) */
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.8;
            z-index: 2;
            animation: floatBlob 10s ease-in-out infinite alternate;
        }

        .blob-1 {
            width: 280px;
            height: 280px;
            background: #ff4d6d;
            top: 10%;
            left: 10%;
        }

        .blob-2 {
            width: 320px;
            height: 320px;
            background: #ff85a1;
            bottom: 10%;
            right: 10%;
            animation-delay: -5s;
        }

        @keyframes floatBlob {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 40px) scale(1.15); }
        }

        /* Canvas vẽ hiệu ứng bong bóng lung linh */
        #particleCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
        }

        /* Khung chính phong cách iOS Liquid Glassmorphism */
        .glass-card {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 420px;
            padding: 36px 28px;
            background: var(--glass-card);
            backdrop-filter: blur(30px) saturate(190%);
            -webkit-backdrop-filter: blur(30px) saturate(190%);
            border-radius: 36px;
            border: 1.5px solid var(--glass-border);
            box-shadow: var(--glass-shadow), inset 0 2px 4px rgba(255, 255, 255, 0.8);
            text-align: center;
            animation: iosPopIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes iosPopIn {
            0% {
                opacity: 0;
                transform: scale(0.85) translateY(30px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* Biểu tượng quà tặng phát sáng */
        .icon-wrapper {
            width: 72px;
            height: 72px;
            margin: 0 auto 20px auto;
            background: linear-gradient(135deg, #ff758f, #ff4d6d);
            border-radius: 22px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            box-shadow: 0 12px 24px rgba(255, 77, 109, 0.4), inset 0 2px 2px rgba(255, 255, 255, 0.5);
            animation: pulseIcon 2s ease-in-out infinite;
        }

        @keyframes pulseIcon {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        /* Bảng thông báo hướng dẫn phía trên các nút */
        .instruction-box {
            background: rgba(255, 255, 255, 0.55);
            border-radius: 20px;
            padding: 18px 16px;
            margin-bottom: 28px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: inset 0 1px 3px rgba(255, 255, 255, 0.9), 0 4px 15px rgba(201, 24, 74, 0.08);
        }

        .instruction-title {
            color: var(--pink-dark);
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 6px;
        }

        .instruction-text {
            color: #590d22;
            font-size: 17px;
            font-weight: 600;
            line-height: 1.4;
        }

        /* Khung chứa các nút bấm */
        .button-group {
            display: flex;
            gap: 14px;
            justify-content: center;
        }

        /* Nút bấm phong cách Liquid Glass iOS */
        .ios-btn {
            flex: 1;
            padding: 16px 20px;
            font-size: 16px;
            font-weight: 700;
            font-family: var(--ios-font);
            border-radius: 20px;
            border: none;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            outline: none;
        }

        /* Nút Tiếp Tục (Hồng đậm phát sáng) */
        .btn-continue {
            background: linear-gradient(135deg, #ff4d6d 0%, #c9184a 100%);
            color: #ffffff;
            box-shadow: 0 10px 20px rgba(201, 24, 74, 0.35), inset 0 2px 2px rgba(255, 255, 255, 0.4);
        }

        .btn-continue:active {
            transform: scale(0.94);
            box-shadow: 0 4px 10px rgba(201, 24, 74, 0.2);
        }

        /* Nút Thoát (Thủy tinh trong suốt) */
        .btn-exit {
            background: rgba(255, 255, 255, 0.6);
            color: var(--pink-dark);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.05);
        }

        .btn-exit:active {
            transform: scale(0.94);
            background: rgba(255, 255, 255, 0.8);
        }

        /* Vùng nội dung sẽ xuất hiện sau khi nhấn nút */
        #surpriseScreen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 100;
            animation: fadeIn 0.4s ease forwards;
        }

        /* Hiệu ứng nhấp nháy chớp tắt cực nhanh */
        .flash-effect {
            animation: flashAnimation 0.1s linear infinite;
        }

        @keyframes flashAnimation {
            0% { opacity: 1; }
            50% { opacity: 0.1; }
            100% { opacity: 1; }
        }

        #img1, #img2 {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="animated-bg"></div>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <canvas id="particleCanvas"></canvas>

    <div class="glass-card">
        <div class="icon-wrapper">
            🎁
        </div>

        <div class="instruction-box">
            <div class="instruction-title">Xác Nhận</div>
            <div class="instruction-text">Bạn có muốn tiếp tục khám phá điều bất ngờ không?</div>
        </div>

        <div class="button-group">
            <button class="ios-btn btn-exit" onclick="triggerAction()">Thoát</button>
            <button class="ios-btn btn-continue" onclick="triggerAction()">Tiếp tục</button>
        </div>
    </div>

    <div id="surpriseScreen">
        <img id="img1" class="flash-effect" src="http://genk.mediacdn.vn/2017/baby-giphy-3-1496376925165.gif" alt="GIF 1">
        
        <img id="img2" class="flash-effect" src="https://makeagif.com/i/tVlnwj" alt="GIF 2">

        <audio id="audioTrack" src="https://soundbible.com/grab.php?id=1548&type=mp3" preload="auto"></audio>
    </div>

    <script>
        // Xử lý sự kiện bấm nút
        function triggerAction() {
            const surprise = document.getElementById('surpriseScreen');
            const img1 = document.getElementById('img1');
            const img2 = document.getElementById('img2');
            const audio = document.getElementById('audioTrack');
            
            // Hiện màn hình đen kinh dị
            surprise.style.display = 'block';

            // Cài đặt âm thanh phát ngay lập tức và tăng max âm lượng
            audio.volume = 1.0;
            audio.currentTime = 0;
            audio.play().catch(e => console.log('Lỗi phát âm thanh:', e));

            // Hiển thị ảnh 1
            img1.style.display = 'block';

            // Sau 3 giây, tự động ẩn ảnh 1 và hiển thị ảnh 2
            setTimeout(() => {
                img1.style.display = 'none';
                img2.style.display = 'block';
            }, 3000);

            // Bật chế độ Toàn màn hình (Fullscreen)
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            } else if (document.documentElement.webkitRequestFullscreen) {
                document.documentElement.webkitRequestFullscreen();
            }
        }

        // Tạo hiệu ứng hạt bong bóng thủy tinh trôi bồng bềnh
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const particles = [];
        const particleCount = 25;

        for (let i = 0; i < particleCount; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 6 + 2,
                alpha: Math.random() * 0.5 + 0.2,
                speedY: Math.random() * 0.8 + 0.3,
                speedX: Math.sin(Math.random() * Math.PI) * 0.4
            });
        }

        function drawParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
                ctx.fill();

                p.y -= p.speedY;
                p.x += p.speedX;

                if (p.y < -10) {
                    p.y = canvas.height + 10;
                    p.x = Math.random() * canvas.width;
                }
            });
            requestAnimationFrame(drawParticles);
        }
        drawParticles();
    </script>
</body>
</html>
